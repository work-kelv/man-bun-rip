<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Man Bun Rip</title>
  <script>
    try {
      var t = new URLSearchParams(location.search).get("theme") || localStorage.getItem("mbr-theme");
      if (t === "dark") document.documentElement.dataset.theme = "dark";
    } catch (e) {}
  </script>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="hero">
        <img src="/static/img/bassist-cutout.png" alt="Ink illustration of a bassist in a bowler hat and round glasses holding a bass guitar">
      </div>
      <div class="brand">
        <h1>Man Bun Rip</h1>
        <p>Find it. Hear it. Slow it down. Learn the bass line.</p>
      </div>

      <section class="settings" aria-label="Download settings">
        <div class="field">
          <span class="field-label" id="fmt-label">Output format</span>
          <div class="segmented" role="radiogroup" aria-labelledby="fmt-label" id="format-group">
            <button type="button" role="radio" data-format="mp3" aria-checked="true" title="MP3 at 320 kbps">MP3</button>
            <button type="button" role="radio" data-format="wav" aria-checked="false" title="Uncompressed — best for DAWs &amp; transcription">WAV</button>
            <button type="button" role="radio" data-format="m4a" aria-checked="false" title="AAC audio in M4A">M4A</button>
            <button type="button" role="radio" data-format="mp4" aria-checked="false" title="MP4 video, up to 1080p">Video</button>
          </div>
          <span class="field-hint" id="format-hint">320 kbps — small files, great for phones</span>
        </div>

        <div class="field">
          <label class="field-label" for="speed-select">Practice speed</label>
          <select id="speed-select">
            <option value="1">100% Original</option>
            <option value="0.9">90%</option>
            <option value="0.8">80%</option>
            <option value="0.75">75%</option>
            <option value="0.6">60%</option>
          </select>
          <span class="field-hint">Slower tempo, same pitch.</span>
        </div>
      </section>

      <footer class="sidebar-foot">
        <div class="field">
          <span class="field-label">Save to</span>
          <div class="folder">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
            <span class="folder-path" id="folder-path" title="">~/Downloads</span>
          </div>
          <div class="folder-actions">
            <button type="button" class="btn btn-ghost btn-sm" id="folder-change">Change…</button>
            <button type="button" class="btn btn-link btn-sm" id="folder-reset" hidden>Use Downloads</button>
          </div>
        </div>
      </footer>
    </aside>

    <main class="main">
      <header class="topbar">
        <form id="search-form" class="search" autocomplete="off">
          <svg class="search-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <input id="search-input" type="text" placeholder="Search a song or paste a YouTube link…" aria-label="Search YouTube or paste a link" spellcheck="false">
          <button type="submit" class="btn btn-primary" id="search-btn">Search</button>
        </form>

        <div class="updater">
          <span class="status-dot" id="update-dot" title="yt-dlp status"></span>
          <span class="updater-version" id="ytdlp-version">yt-dlp …</span>
          <button type="button" class="btn btn-ghost btn-sm" id="update-btn">Update yt-dlp</button>
        </div>
        <button type="button" class="icon-btn" id="theme-btn" aria-label="Switch to dark mode" title="Switch to dark mode">
          <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>
          <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        </button>
      </header>

      <div class="notice" id="notice" hidden></div>

      <section class="results" id="results" aria-live="polite">
        <div class="empty" id="empty">
          <h2>What are we learning today?</h2>
          <p>Search for a song, or paste a YouTube link, then download it at practice speed.</p>
          <div class="chips">
            <button type="button" class="chip" data-q="Jaco Pastorius Teen Town">Jaco – Teen Town</button>
            <button type="button" class="chip" data-q="Vulfpeck Dean Town">Vulfpeck – Dean Town</button>
            <button type="button" class="chip" data-q="James Jamerson isolated bass">Jamerson isolated bass</button>
          </div>
        </div>
      </section>
    </main>
  </div>

  <template id="card-template">
    <article class="card">
      <div class="card-row">
        <div class="thumb">
          <img alt="" loading="lazy">
          <span class="badge"></span>
        </div>
        <div class="meta">
          <h3 class="title"></h3>
          <p class="channel"></p>
        </div>
        <div class="actions">
          <button type="button" class="btn btn-primary js-download">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v11m0 0-4.5-4.5M12 15l4.5-4.5M5 20h14"/></svg><span>Download</span>
          </button>
        </div>
      </div>
      <div class="jobs"></div>
    </article>
  </template>

  <script src="/static/app.js"></script>
</body>
</html>
